<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Markets" />
<title>Markets · IndiaVIX · Nifty50 · USDINR</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
  :root {
    --bg: #0b0d12;
    --fg: #f5f7fb;
    --muted: #8b93a7;
    --card: #141826;
    --card-2: #1b2030;
    --accent: #7c5cff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bot: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    background: radial-gradient(120% 80% at 50% 0%, #1a1f33 0%, var(--bg) 60%) fixed;
    color: var(--fg);
    overscroll-behavior: none;
    padding: calc(var(--safe-top) + 10px) 10px calc(var(--safe-bot) + 10px);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px;
    gap: 8px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: 0.2px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  .controls { display: flex; gap: 6px; align-items: center; }
  .ranges { display: flex; gap: 4px; background: var(--card); padding: 4px; border-radius: 10px; }
  .ranges button {
    background: transparent; color: var(--muted); border: 0;
    padding: 6px 10px; border-radius: 7px; font-size: 12px; font-weight: 600;
    cursor: pointer;
  }
  .ranges button.active { background: var(--card-2); color: var(--fg); }
  .icon-btn {
    background: var(--card); color: var(--fg); border: 0;
    border-radius: 10px; padding: 8px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 36px; min-height: 36px;
  }
  .icon-btn:active { transform: scale(0.94); }

  .charts {
    flex: 1;
    display: grid;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 10px;
    min-height: 0;
  }
  .card {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    min-height: 0;
    position: relative;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .card-label {
    position: absolute; top: 8px; left: 12px; z-index: 2;
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.6px; font-weight: 700;
    pointer-events: none;
    background: rgba(11,13,18,0.55);
    padding: 3px 8px; border-radius: 6px;
    backdrop-filter: blur(6px);
  }
  .tradingview-widget-container,
  .tradingview-widget-container__widget {
    width: 100% !important;
    height: 100% !important;
  }
  .tradingview-widget-container { display: block; }
  .tradingview-widget-copyright { display: none !important; }

  footer {
    text-align: center; color: var(--muted); font-size: 11px; opacity: 0.7;
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> Markets</div>
  <div class="controls">
    <div class="ranges" id="ranges">
      <button data-range="1D">1D</button>
      <button data-range="5D">5D</button>
      <button data-range="1M" class="active">1M</button>
      <button data-range="6M">6M</button>
      <button data-range="12M">1Y</button>
    </div>
    <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
</header>

<div class="charts" id="charts">
  <div class="card" data-symbol="NSE:INDIAVIX" data-label="India VIX"></div>
  <div class="card" data-symbol="NSE:NIFTY" data-label="Nifty 50"></div>
  <div class="card" data-symbol="FX_IDC:USDINR" data-label="USD / INR"></div>
</div>

<footer><span id="updatedAt">loading…</span> · live quotes via TradingView</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  let currentRange = '1M';

  function mountWidget(card) {
    const symbol = card.dataset.symbol;
    const label = card.dataset.label;
    card.innerHTML = `
      <div class="card-label">${label}</div>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
      </div>
    `;
    const config = {
      symbol,
      width: "100%",
      height: "100%",
      locale: "en",
      dateRange: currentRange,
      colorTheme: "dark",
      isTransparent: true,
      autosize: true,
      largeChartUrl: "",
      chartOnly: false,
      noTimeScale: false,
      trendLineColor: "rgba(124, 92, 255, 1)",
      underLineColor: "rgba(124, 92, 255, 0.15)",
      underLineBottomColor: "rgba(124, 92, 255, 0)"
    };
    const s = document.createElement('script');
    s.type = 'text/javascript';
    s.async = true;
    s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js';
    s.text = JSON.stringify(config);
    card.querySelector('.tradingview-widget-container').appendChild(s);
  }

  function mountAll() {
    document.querySelectorAll('.card').forEach(mountWidget);
    $('updatedAt').textContent = 'updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  document.querySelectorAll('#ranges button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#ranges button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRange = btn.dataset.range;
      mountAll();
    });
  });
  $('refreshBtn').addEventListener('click', mountAll);

  mountAll();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
